<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico do Sistema - GOR INFORMÁTICA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .summary {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }
        
        .summary.success {
            border-left-color: #28a745;
            background: #d4edda;
        }
        
        .summary.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }
        
        .summary h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        
        .test-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #ddd;
            transition: all 0.3s;
        }
        
        .test-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .test-item.ok {
            border-left-color: #28a745;
        }
        
        .test-item.fail {
            border-left-color: #dc3545;
        }
        
        .test-item.info {
            border-left-color: #17a2b8;
        }
        
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .test-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }
        
        .test-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .test-status.ok {
            background: #28a745;
            color: white;
        }
        
        .test-status.fail {
            background: #dc3545;
            color: white;
        }
        
        .test-status.info {
            background: #17a2b8;
            color: white;
        }
        
        .test-message {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .test-details {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .btn-refresh {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: block;
            margin: 20px auto;
        }
        
        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .error-box {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            color: #721c24;
        }
        
        .error-box h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Diagnóstico do Sistema</h1>
            <p>Sistema de Cadastro de Currículos - GOR INFORMÁTICA</p>
        </div>
        
        <div class="content">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Executando testes de diagnóstico...</p>
            </div>
            
            <div id="results" style="display: none;">
                <div id="summary" class="summary"></div>
                <div id="tests"></div>
                <button class="btn-refresh" onclick="runDiagnostics()">🔄 Executar Novamente</button>
            </div>
            
            <div id="error" style="display: none;" class="error-box"></div>
        </div>
    </div>
    
    <script>
        function runDiagnostics() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            
            fetch('test_connection.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erro HTTP: ${response.status} ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    displayResults(data);
                })
                .catch(error => {
                    displayError(error);
                });
        }
        
        function displayResults(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            
            // Summary
            const summaryDiv = document.getElementById('summary');
            const summaryClass = data.summary.failed === 0 ? 'success' : 'error';
            summaryDiv.className = `summary ${summaryClass}`;
            summaryDiv.innerHTML = `
                <h2>${data.summary.overall_status}</h2>
                <p><strong>Total de testes:</strong> ${data.summary.total_tests}</p>
                <p><strong>Aprovados:</strong> ${data.summary.passed} ✅</p>
                <p><strong>Falharam:</strong> ${data.summary.failed} ❌</p>
                <p><strong>Data/Hora:</strong> ${data.timestamp}</p>
                <p><strong>Versão PHP:</strong> ${data.php_version}</p>
            `;
            
            // Tests
            const testsDiv = document.getElementById('tests');
            testsDiv.innerHTML = '';
            
            for (const [key, test] of Object.entries(data.tests)) {
                const testDiv = document.createElement('div');
                const statusClass = test.status.toLowerCase();
                testDiv.className = `test-item ${statusClass}`;
                
                let messageHtml = '';
                if (typeof test.message === 'object') {
                    messageHtml = '<div class="test-details">';
                    for (const [k, v] of Object.entries(test.message)) {
                        messageHtml += `<div><strong>${k}:</strong> ${v}</div>`;
                    }
                    messageHtml += '</div>';
                } else {
                    messageHtml = `<div class="test-message">${test.message}</div>`;
                }
                
                testDiv.innerHTML = `
                    <div class="test-header">
                        <div class="test-name">${test.name}</div>
                        <div class="test-status ${statusClass}">${test.status}</div>
                    </div>
                    ${messageHtml}
                `;
                
                testsDiv.appendChild(testDiv);
            }
        }
        
        function displayError(error) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            
            const errorDiv = document.getElementById('error');
            errorDiv.innerHTML = `
                <h3>❌ Erro ao executar diagnóstico</h3>
                <p><strong>Erro:</strong> ${error.message}</p>
                <p>Possíveis causas:</p>
                <ul>
                    <li>O arquivo test_connection.php não existe ou não está acessível</li>
                    <li>Problema de permissões no servidor</li>
                    <li>Erro de configuração do PHP</li>
                    <li>Problema de conexão com o servidor</li>
                </ul>
                <button class="btn-refresh" onclick="runDiagnostics()">🔄 Tentar Novamente</button>
            `;
        }
        
        // Executar diagnóstico ao carregar a página
        window.addEventListener('DOMContentLoaded', runDiagnostics);
    </script>
</body>
</html>
